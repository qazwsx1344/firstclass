<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>렌즈미 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css?v=20261028-header5">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="header-inner">
                <div class="header-top">
                    <div class="header-utility">
                        <a class="welcome" href="#" aria-label="렌즈미 홈">welcome!</a>
                        <a href="#" aria-label="검색">검색</a>
                        <a href="#">고객센터</a>
                        <a href="#">로그인/마이페이지</a>
                        <a href="#">장바구니</a>
                    </div>
                    <a class="header-logo" href="#" aria-label="렌즈미 홈">
                        <img src="img/logo_new%202.svg" alt="렌즈미">
                    </a>
                    <button class="mobile-menu-button" type="button" aria-expanded="false" aria-controls="primary-navigation">
                        <span></span>
                        <span></span>
                        <span class="sr-only">메뉴 열기</span>
                    </button>
                </div>
                <nav class="primary-navigation" id="primary-navigation" aria-label="주요 메뉴">
                    <a href="#">렌즈</a>
                    <a class="nav-highlight" href="#">나만의 렌즈 찾기</a>
                    <a href="#">온라인 전용</a>
                    <a href="#">매장찾기</a>
                    <a href="#">EVENT</a>
                    <a href="#">브랜드</a>
                </nav>
            </div>
        </header>
        <main>
            <section class="hero-sec" aria-label="렌즈미 메인 배너">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <video class="pc" autoplay muted loop playsinline aria-label="렌즈미 메인 영상">
                                <source src="video/Hero.mp4" type="video/mp4">
                            </video>
                            <video class="mo" autoplay muted loop playsinline aria-label="렌즈미 모바일 메인 영상">
                                <source src="video/Hero.mp4" type="video/mp4">
                            </video>
                        </div>
                        <div class="swiper-slide">
                            <img src="img/Hero_2.png" alt="렌즈미 프로모션 배너" class="pc">
                            <img src="img/m_visual202.png" alt="렌즈미 프로모션 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/Hero_3.png" alt="렌즈미 메인 배너" class="pc">
                            <img src="img/m_visual203.png" alt="렌즈미 메인 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/Hero_4.png" alt="렌즈미 프로모션 배너" class="pc">
                            <img src="img/m_visual204.png" alt="렌즈미 프로모션 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/Hero_5.png" alt="렌즈미 프로모션 배너" class="pc">
                            <img src="img/m_visual205.png" alt="렌즈미 프로모션 배너" class="mo">
                        </div>
                    </div>
                    <div class="swiper-pagination" aria-label="배너 선택"></div>
                </div>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>

    <script>
        const swiper = new Swiper('.hero-sec .visual', {
            direction: 'horizontal',
            loop: true,
            speed: 600,
            pagination: {
                el: '.visual .swiper-pagination',
                clickable: true
            }
        });

        const menuButton = document.querySelector('.mobile-menu-button');
        const navigation = document.querySelector('.primary-navigation');

        menuButton.addEventListener('click', () => {
            const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
            menuButton.setAttribute('aria-expanded', String(!isExpanded));
            navigation.classList.toggle('is-open', !isExpanded);
        });
    </script>
</body>
</html>
